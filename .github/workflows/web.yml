# Builds the iPhone / browser version on every push to main and publishes it to GitHub Pages at
# https://simmerdan07.github.io/LifeSimulator-Upgraded/ — open that in Safari on the iPhone, then Share → Add to Home Screen.
# Works with either Pages setting (Settings → Pages → Source):
#   "GitHub Actions"          → the deploy job below publishes it directly;
#   "Deploy from a branch"    → pick gh-pages / (root); the build job pushes the site there.
name: Build iPhone web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the web app
        run: npm run web

      - name: Publish to the gh-pages branch
        working-directory: dist-web
        run: |
          V=$(node -p "require('../package.json').version")
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Life Simulator v$V (web app)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published v$V to gh-pages" >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: web
    runs-on: ubuntu-latest
    # only does anything when Settings → Pages → Source is "GitHub Actions"; otherwise the gh-pages branch is used
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
