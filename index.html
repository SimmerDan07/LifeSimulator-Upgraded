<!DOCTYPE html>
<html lang="en">
<head>
<meta name="theme-color" content="#2c2c2e">
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Sim">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Life Simulator</title>
<link rel="stylesheet" href="renderer.css">
</head>
<body class="android web">
<header id="hud">
    <div class="who">
        <div id="hud-name"></div>
        <div class="date"><span id="hud-age"></span><span>·</span><span id="hud-month"></span><span id="hud-week"></span></div>
    </div>
    <div class="stats">
        <div class="stat" title="Health"><span class="fa" style="color:#d65645">&#xf004;</span><div class="bar"><div id="hud-health"></div></div></div>
        <div class="stat" title="Happiness"><span class="fa" style="color:#f1c40f">&#xf118;</span><div class="bar"><div id="hud-happiness"></div></div></div>
        <div class="stat" title="Sanity"><span class="fa" style="color:#e685c1">&#xf5dc;</span><div class="bar"><div id="hud-sanity"></div></div></div>
        <div class="stat thirst" title="Thirst"><span class="fa" style="color:#b3262e">&#xf043;</span><div class="bar"><div id="hud-thirst"></div></div></div>
    </div>
    <div><button id="hud-fame" title="Celebrity Life" hidden></button></div>
    <div class="money">
        <div title="Cash"><img id="hud-cash-icon" alt=""><span id="hud-cash"></span></div>
        <div title="Bank"><img id="hud-bank-icon" alt=""><span id="hud-bank"></span></div>
    </div>
    <div class="hud-buttons">
        <button id="hud-news" title="News: what happened while the weeks went by"><span class="fa">&#xf0f3;</span><span id="hud-news-count" hidden></span></button>
        <button id="hud-settings" title="Settings"><img alt=""></button>
    </div>
</header>
<header id="nhud">
    <div class="nh-row1">
        <div class="nh-who"><span id="nh-name"></span><span id="nh-vamp" class="fa" title="Vampire" hidden>&#xf043;</span></div>
        <button id="nh-fame" title="Celebrity Life" hidden></button>
        <button id="nh-money" title="Money (cash + bank)"><span id="nh-total"></span></button>
        <button id="nh-news" class="nh-icon" title="News"><span class="fa">&#xf0f3;</span><span id="nh-news-count" hidden></span></button>
        <button id="nh-settings" class="nh-icon" title="Settings"><span class="fa">&#xf013;</span></button>
    </div>
    <div class="nh-row2">
        <div id="nh-date"></div>
        <button id="nh-stats" title="Health, happiness and sanity">
            <span class="nh-stat"><span class="fa" style="color:#d65645">&#xf004;</span><span class="bar"><span id="nh-health"></span></span></span>
            <span class="nh-stat"><span class="fa" style="color:#f1c40f">&#xf118;</span><span class="bar"><span id="nh-happiness"></span></span></span>
            <span class="nh-stat"><span class="fa" style="color:#e685c1">&#xf5dc;</span><span class="bar"><span id="nh-sanity"></span></span></span>
            <span class="nh-stat thirst"><span class="fa" style="color:#b3262e">&#xf043;</span><span class="bar"><span id="nh-thirst"></span></span></span>
        </button>
    </div>
</header>
<nav id="tabs"></nav>
<nav id="tabbar"></nav>
<main id="main">
    <div id="subtabs"></div>
    <div id="content"></div>
    <div id="footer" class="empty"></div>
</main>
<div id="overlay"></div>
<div id="modals"></div>
<div id="toasts"></div>
<script src="renderer.js"></script>
<script src="pwa.js"></script>
</body>
</html>
